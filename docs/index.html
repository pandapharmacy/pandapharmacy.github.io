<script>
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const won = n => '₩' + Math.round(n || 0).toLocaleString('en-US');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  let t = $('#toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2400);
}

// 呼叫後端：回傳 Promise，失敗會 reject(Error)
// 後端：Supabase（資料庫函式），網址與公開金鑰在建置時填入
const SUPA_URL = 'https://lwchkokwkhoonuwzelht.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3Y2hrb2t3a2hvb251d3plbGh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNTEwNzMsImV4cCI6MjExMDYyNzA3M30.lSe3dDBjwSjHygUDsUVsiv6rbFUZXXyDgbOyJAo2qyc';
function api(fn, ...args){
  return fetch(`${SUPA_URL}/rest/v1/rpc/${fn.toLowerCase()}`, {
    method:'POST',
    headers:{ 'apikey':SUPA_KEY, 'Authorization':'Bearer ' + SUPA_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ args })
  }).catch(() => { throw new Error('連線失敗，請檢查網路後再試'); })
    .then(r => r.json().catch(() => ({})).then(j => {
      if (j && j.ok) return j.data;
      throw new Error(j && j.error ? j.error : (j && j.message ? '系統錯誤：' + j.message : '連線失敗，請稍後再試'));
    }));
}
// 上傳商品照片到 Supabase Storage，回傳公開網址
async function uploadImage(blob, name){
  const path = `p/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}.jpg`;
  const r = await fetch(`${SUPA_URL}/storage/v1/object/product-images/${path}`, {
    method:'POST', headers:{ 'apikey':SUPA_KEY, 'Authorization':'Bearer ' + SUPA_KEY, 'Content-Type':'image/jpeg', 'x-upsert':'false' }, body: blob });
  if (!r.ok) throw new Error('照片上傳失敗（' + r.status + '）');
  return `${SUPA_URL}/storage/v1/object/public/product-images/${path}`;
}

// 金額計算：和 Code.gs 的 totals_ 同一套
function refundFor(total, s){
  if (total >= s.refundAboveFrom) return Math.floor(total * s.refundAbovePct / 100) * 100;
  let r = 0; (s.refundTable || []).forEach(row => { if (total >= row[0]) r = row[1]; });
  return r;
}
function totals(subtotal, s, rate){
  const discount = Math.round(subtotal * (rate > 0 ? rate : 0));
  const refund = refundFor(subtotal, s);
  return { subtotal, discount, refund, net: subtotal - discount - refund };
}
// 距離下一個退稅級距還差多少
function nextBracket(total, s){
  if (total >= s.refundAboveFrom) return null;
  const rows = (s.refundTable || []).filter(r => r[0] > total);
  if (!rows.length) return null;
  return { need: rows[0][0] - total, refund: rows[0][1] };
}

// 訂購單 HTML。mode: 'customer'（中文、含優惠退稅）或 'pharmacy'（韓文、給藥局老闆）
function orderSheetHTML(o, s, mode){
  const ko = mode === 'pharmacy';
  const shop = String(s.shopName || '熊貓藥局 Panda Pharmacy｜臺灣客人專屬訂購網頁').split('｜');
  const pk = (s.pickups || []).find(p => p.name === o.pickup) || { name: o.pickup, addr: '' };
  const rows = o.items.map((it, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${ko ? `<b>${esc(it.nameKo || it.name)}</b>${it.nameKo ? `<div class="ko">${esc(it.name)}</div>` : ''}`
               : `<b>${esc(it.name)}</b>${it.brand ? `<div class="ko">${esc(it.brand)}${it.nameKo ? '・' + esc(it.nameKo) : ''}</div>` : ''}`}</td>
      <td class="n">${won(it.price)}</td>
      <td class="n">${it.qty}</td>
      <td class="n">${won(it.amount)}</td>
    </tr>`).join('');
  const qty = o.items.reduce((a, b) => a + b.qty, 0);
  const L = ko
    ? { title:'약국 예약 주문서', sub:'대만 고객 주문 · 상품 보관 요청', no:'주문번호', name:'고객명 (여권 영문)', phone:'연락처', time:'주문일시', pick:'픽업 지점', date:'픽업 예정일', note:'요청사항', item:'상품명', price:'단가', qty:'수량', amt:'금액', total:'합계' }
    : { title:esc(shop[0]), sub:esc(shop[1] || '訂購單'), no:'訂單編號', name:'護照英文姓名', phone:'聯繫方式', time:'下單時間', pick:'取貨地點', date:'預計取貨日', note:'備註', item:'商品', price:'單價', qty:'數量', amt:'複價', total:'商品總價' };
  const pctTxt = o.subtotal ? Math.round(o.discount / o.subtotal * 1000) / 10 + '%' : '';
  return `
  <div class="os ${ko ? 'ko-mode' : ''}">
    <div class="top">
      <div><div class="brand">${L.title}</div><div class="sub">${L.sub}</div></div>
      <div class="no">${L.no}<b>${esc(o.no)}</b>${esc(o.created)}</div>
    </div>
    <div class="meta">
      <div><span>${L.name}</span>${esc(o.name)}</div>
      <div><span>${L.phone}</span>${esc(o.contact || '-')}</div>
      <div class="hl"><span>${L.pick}</span><b class="pick">${esc(pk.name)}</b>${pk.addr ? ` <small>${esc(pk.addr)}</small>` : ''}</div>
      <div class="hl"><span>${L.date}</span><b>${esc(o.date || '-')}</b></div>
      ${o.note ? `<div style="grid-column:1/-1"><span>${L.note}</span>${esc(o.note)}</div>` : ''}
    </div>
    <table>
      <thead><tr><th style="width:34px">#</th><th>${L.item}</th><th class="n">${L.price}</th><th class="n">${L.qty}</th><th class="n">${L.amt}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="sum">
      ${ko
        ? `<div><span>총 수량</span><span>${qty}</span></div>
           <div class="grand"><span>${L.total}</span><b>${won(o.subtotal)}</b></div>`
        : `<div><span>${L.total}（${qty} 件）</span><span class="won">${won(o.subtotal)}</span></div>
           ${o.discount > 0 ? `<div class="minus"><span>優惠碼 ${esc(o.coupon)}（${pctTxt}）</span><span class="won">−${won(o.discount)}</span></div>` : ''}
           <div class="minus"><span>預估退稅</span><span class="won">−${won(o.refund)}</span></div>
           <div class="grand"><span>預估實際花費</span><b class="won">${won(o.net)}</b></div>`}
    </div>
    <div class="note">${ko ? '위 상품의 보관을 부탁드립니다. 결제는 픽업 시 매장에서 진행합니다. 감사합니다.'
      : `${esc(s.notice || '')}<br>結帳與取貨皆在韓國藥局現場，本訂購單不需線上付款。`}</div>
  </div>`;
}

// 把訂購單畫成 canvas（離開畫面渲染）
async function sheetCanvas(o, s, mode){
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-10000px;top:0;';
  holder.innerHTML = orderSheetHTML(o, s, mode);
  document.body.appendChild(holder);
  try { await document.fonts.ready; } catch(e){}
  const canvas = await html2canvas(holder.firstElementChild, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
  holder.remove();
  return canvas;
}

function triggerDownload(url, filename){
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}

// 產出圖片：跳出預覽（手機可長按儲存）＋下載按鈕
async function exportImage(o, s, mode){
  toast('產生圖片中…');
  const c = await sheetCanvas(o, s, mode);
  const url = c.toDataURL('image/png');
  showImagePreview(url, `${o.no}${mode === 'pharmacy' ? '_藥局版' : ''}.png`);
}

async function exportPDF(o, s, mode){
  toast('產生 PDF 中…');
  const c = await sheetCanvas(o, s, mode);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, H = 297, m = 8;
  const imgW = W - m * 2, imgH = c.height * imgW / c.width;
  const img = c.toDataURL('image/jpeg', 0.92);
  let y = 0;
  while (y < imgH) {
    if (y > 0) pdf.addPage();
    pdf.addImage(img, 'JPEG', m, m - y, imgW, imgH);
    y += H - m * 2;
  }
  const name = `${o.no}${mode === 'pharmacy' ? '_藥局版' : ''}.pdf`;
  try { pdf.save(name); }
  catch(e){ window.open(pdf.output('bloburl'), '_blank'); }
}

function showImagePreview(url, filename){
  let ov = $('#imgprev');
  if (!ov){
    ov = document.createElement('div'); ov.id = 'imgprev';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:90;display:flex;flex-direction:column;align-items:center;padding:16px;overflow:auto';
    document.body.appendChild(ov);
  }
  ov.innerHTML = `
    <div style="color:#fff;font-size:14px;margin-bottom:10px;text-align:center">手機請<b>長按圖片</b>儲存或分享；電腦按下載</div>
    <img src="${url}" style="max-width:100%;border-radius:8px;background:#fff">
    <div style="display:flex;gap:10px;margin:14px 0 30px">
      <button class="btn" id="ipdl">下載圖片</button>
      <button class="btn ghost" id="ipclose">關閉</button>
    </div>`;
  ov.style.display = 'flex';
  $('#ipdl', ov).onclick = () => triggerDownload(url, filename);
  $('#ipclose', ov).onclick = () => { ov.style.display = 'none'; };
}

// 搜尋用：去掉空白標點、轉小寫
const norm = s => String(s || '').toLowerCase().replace(/[\s\-_.,，、。・·/()（）]/g, '');
</script>

@keyframes shine{0%{transform:translateX(-160%) skewX(-18deg)}55%,100%{transform:translateX(330%) skewX(-18deg)}}
.chip.tw{background:linear-gradient(135deg,#ffb300,#ffd23f 50%,#ff9800);border-color:#ffb300;color:#5a3200;font-weight:700}
.chip.tw.on{background:linear-gradient(135deg,#ff8f00,#ffc400 50%,#ff6f00);border-color:#ff8f00;color:#fff}
.sec-h h2.tw{display:inline-block;padding:2px 12px;border-radius:10px;background:linear-gradient(135deg,#ffb300,#ffd23f 50%,#ff9800);color:#5a3200}
@media (prefers-reduced-motion:reduce){.shine::after{animation:none;display:none}}
.hot{background:linear-gradient(90deg,#d50000,#ff3d00,#ff9100,#ff3d00,#d50000);background-size:300% 100%;color:#fff;border-color:#ff3d00;
  animation:fireflow 1.8s linear infinite,fireglow 1.1s ease-in-out infinite alternate;text-shadow:0 0 4px rgba(255,214,0,.8)}
.hot::before{content:"🔥";display:inline-block;margin-right:3px;transform-origin:50% 90%;animation:flicker .45s ease-in-out infinite alternate}
@keyframes fireflow{from{background-position:0% 50%}to{background-position:300% 50%}}
@keyframes fireglow{from{box-shadow:0 0 4px rgba(255,61,0,.55),0 -1px 6px rgba(255,145,0,.35)}to{box-shadow:0 0 10px rgba(255,61,0,.9),0 -3px 14px rgba(255,196,0,.6)}}
@keyframes flicker{0%{transform:scale(1) rotate(-6deg);filter:brightness(1)}50%{transform:scale(1.18,1.08) rotate(3deg);filter:brightness(1.3)}100%{transform:scale(.95,1.12) rotate(6deg);filter:brightness(1.1)}}
.chip.hot,.chip.hot.on{color:#fff;font-weight:700;border-color:#ff3d00}
.chip.hot.on{outline:2px solid #ffd600;outline-offset:1px}
.sec-h h2.hot{display:inline-block;padding:2px 12px;border-radius:10px}
@media (prefers-reduced-motion:reduce){.hot,.hot::before{animation:none}}
.champ{background:linear-gradient(135deg,#1a1a1a,#3a2c00 55%,#1a1a1a);color:#ffd54f;border:1px solid #ffc107;font-weight:800;
  box-shadow:0 0 0 1px rgba(255,193,7,.35),0 2px 8px rgba(255,179,0,.45);animation:champglow 1.6s ease-in-out infinite alternate}
.champ::before{content:"👑";display:inline-block;margin-right:3px;transform-origin:50% 100%;animation:crown 1.4s ease-in-out infinite}
.champ.shine::after{background:linear-gradient(105deg,transparent 0%,rgba(255,236,150,0) 25%,rgba(255,236,150,.9) 50%,rgba(255,236,150,0) 75%,transparent 100%)}
@keyframes champglow{from{box-shadow:0 0 0 1px rgba(255,193,7,.35),0 2px 6px rgba(255,179,0,.35)}to{box-shadow:0 0 0 1px rgba(255,215,64,.8),0 0 14px rgba(255,193,7,.75)}}
@keyframes crown{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-2px) rotate(8deg) scale(1.12)}}
.chip.champ,.chip.champ.on{color:#ffd54f;border-color:#ffc107}
.chip.champ.on{outline:2px solid #ffc107;outline-offset:1px}
.sec-h h2.champ{display:inline-block;padding:2px 12px;border-radius:10px}
@media (prefers-reduced-motion:reduce){.champ,.champ::before{animation:none}}
.card .tx{padding:9px 10px 10px;display:flex;flex-direction:column;flex:1}
.card .br{font-size:11.5px;color:var(--ink3)}
.card .nm{font-size:14px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:1px 0 6px}
.card .pr{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
.card .pr b{font-size:16px;color:var(--red);font-variant-numeric:tabular-nums}
.add{width:34px;height:34px;border-radius:10px;background:var(--red);color:#fff;font-size:22px;line-height:1;flex:none}
.step{display:flex;align-items:center;background:var(--red-soft);border-radius:10px;height:34px}
.step button{width:30px;height:34px;font-size:18px;color:var(--red);font-weight:700}
.step span{min-width:20px;text-align:center;font-weight:700;font-size:14px}
.empty{text-align:center;color:var(--ink3);padding:50px 0}
.related{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:none}
.cartbar.show{display:block}
.cartbar .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.cartbar .in div{flex:1;font-size:13px;color:var(--ink2);line-height:1.3}
.cartbar .in b{display:block;font-size:17px;color:var(--ink)}
.citem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.citem .ci{width:56px;height:56px;border-radius:10px;background:#f3eeec center/cover;flex:none}
.citem .cn{flex:1;min-width:0}
.citem .cn b{display:block;font-size:14px;line-height:1.3}
.citem .cn span{font-size:12.5px;color:var(--ink3)}
.tot{background:#fff;border-radius:var(--r);padding:12px 14px;margin-top:14px;box-shadow:var(--shadow)}
.tot div{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.tot .g{color:var(--green)}
.tot .big{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-size:17px;font-weight:900}
.tot .big b{color:var(--red)}
.hint{margin-top:10px;background:#fff7e6;color:#8a5a00;border-radius:10px;padding:9px 12px;font-size:13px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pickopt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px 12px;text-align:left}
.pickopt b{display:block;font-size:17px}
.pickopt small{color:var(--ink3);font-size:12px}
.pickopt.on{border-color:var(--red);background:var(--red-soft)}
.olist{display:flex;flex-direction:column;gap:10px}
.oitem{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;text-align:left;width:100%}
.oitem .t{display:flex;justify-content:space-between;font-weight:700}
.st{font-size:12px;padding:2px 8px;border-radius:6px;background:#eee;font-weight:700}
.st.新訂單{background:#fff1d6;color:#8a5a00}.st.已傳藥局{background:#e3edff;color:#24489c}.st.已留貨{background:#e2f4ea;color:var(--green)}.st.已取貨{background:#ececec;color:#555}.st.已取消{background:#fbe3e3;color:#a11}
.sheetwrap{background:#fff;border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.sheetwrap .scaler{transform-origin:top left}
.tabs2{display:flex;background:#efe9e7;border-radius:10px;padding:3px;margin-bottom:14px}
.tabs2 button{flex:1;height:36px;border-radius:8px;font-weight:700;color:var(--ink2)}
.tabs2 button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.pdimg{aspect-ratio:1;border-radius:var(--r);background:#f3eeec center/cover;margin-bottom:12px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><span id="logoMain">熊貓藥局 <span class="en">Panda Pharmacy</span></span><small id="logoSub">臺灣客人專屬訂購網頁</small></div>
    <button class="iconbtn" id="btnMe" aria-label="會員">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span id="meLabel">登入</span>
    </button>
    <button class="iconbtn" id="btnCart" aria-label="購物車">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
      <span class="badge" id="cartCount" hidden>0</span>
    </button>
  </div>
  <div class="search">
    <label>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜尋商品、品牌、功能（例：痘痘、保濕）" autocomplete="off">
    </label>
    <div class="promo shine">🎉 網站訂購享 <b>95 折</b>　優惠碼 <b>TAIWANLOVE</b> 已自動套用</div>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="main"><div class="spin"></div></main>

<div class="cartbar" id="cartbar">
  <div class="in">
    <div id="cbText"></div>
    <button class="btn" id="cbGo">查看購物車</button>
  </div>
</div>

<div class="overlay" id="ov"></div>
<div class="sheetpanel" id="panel">
  <div class="hd"><span id="pTitle"></span><button class="x" id="pClose">×</button></div>
  <div class="bd" id="pBody"></div>
  <div class="ft" id="pFoot"></div>
</div>

<script>
const S = { settings:null, products:[], byId:{}, cat:'全部', q:'', cart:{}, token:null, me:null, orders:null, coupon:null };
const rate = () => S.coupon ? S.coupon.rate : 0;

// ---------- 本機儲存（失敗就只存在記憶體） ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

// ---------- 初始化 ----------
(async function init(){
  S.cart = store.get('cb_cart', {});
  S.token = store.get('cb_token', null);
  S.coupon = store.get('cb_coupon', null);
  try{
    const d = await api('api_bootstrap');
    S.settings = d.settings; S.products = d.products;
    const shop = String(S.settings.shopName || '').split('｜');
    if (shop[0]) $('#logoMain').innerHTML = esc(shop[0]).replace(/ ([A-Za-z].*)$/, ' <span class="en">$1</span>');
    if (shop[1]) $('#logoSub').textContent = shop[1];
    S.products.forEach(p => S.byId[p.id] = p);
    Object.keys(S.cart).forEach(id => { if(!S.byId[id]) delete S.cart[id]; });
    renderChips(); render(); renderCartBar();
    // 網站優惠碼自動套用（後台設定 autoCoupon；客人自己移除過就不再自動帶入）
    const ac = String(S.settings.autoCoupon || '').trim();
    if (ac && !S.coupon && !store.get('cb_cp_off', false)){
      try{ S.coupon = await api('api_checkCoupon', ac); store.set('cb_coupon', S.coupon); renderCartBar(); }catch(e){}
    }
  }catch(e){
    $('#main').innerHTML = `<div class="empty">讀取失敗：${esc(e.message)}<br><br><button class="btn" onclick="location.reload()">重新整理</button></div>`;
  }
  if (S.token){
    try{ S.me = await api('api_me', S.token); }catch(e){ S.token = null; store.del('cb_token'); }
  }
  renderMe();
})();

function allCats(){ return [...S.settings.specialCategories, ...S.settings.functionCategories]; }
function tagClass(c){ const sp = S.settings.specialCategories; return c === sp[0] ? 'hot' : c === sp[1] ? 'champ' : c === sp[2] ? 'tw' : ''; }

// ---------- 分類列 ----------
function renderChips(){
  const sp = S.settings.specialCategories;
  const has = c => S.products.some(p => p.cats.includes(c));
  const btns = ['全部', ...sp.filter(has)].map(c =>
    `<button class="chip ${sp.includes(c) ? 'sp' : ''} ${c === sp[2] ? 'tw shine' : c === sp[1] ? 'champ shine' : c === sp[0] ? 'hot' : ''} ${S.cat === c ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const fn = S.settings.functionCategories.filter(has);
  const inFn = fn.includes(S.cat);
  const sel = fn.length ? `<label class="chip fsel ${inFn ? 'on' : ''}"><span>${inFn ? esc(S.cat) : '依功效分類'}</span><span class="car">▾</span>
      <select id="fnSel" aria-label="依功效分類"><option value="">依功效分類</option>${fn.map(c => `<option value="${esc(c)}" ${S.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>` : '';
  $('#chips').innerHTML = btns + sel;
  if ($('#fnSel')) $('#fnSel').onchange = e => { S.cat = e.target.value || '全部'; S.q = ''; $('#q').value = ''; renderChips(); render(); window.scrollTo({top:0}); };
}
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('button.chip'); if(!b) return;
  S.cat = b.dataset.c; S.q = ''; $('#q').value = '';
  renderChips(); render(); window.scrollTo({top:0});
});

let qTimer;
$('#q').addEventListener('input', e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { S.q = e.target.value.trim(); if (S.q) S.cat = '全部'; renderChips(); render(); }, 150);
});

// ---------- 商品卡 ----------
function cardHTML(p){
  const qty = S.cart[p.id] || 0;
  const tags = p.cats.filter(c => S.settings.specialCategories.includes(c));
  return `
  <div class="card" data-id="${p.id}">
    <div class="im" data-open="${p.id}" style="${p.img ? `background-image:url('${esc(p.img)}')` : ''}">
      <div class="tags">${tags.map(t => `<span class="tag ${tagClass(t)}${['tw','champ'].includes(tagClass(t)) ? ' shine' : ''}">${esc(t)}</span>`).join('')}</div>
    </div>
    <div class="tx">
      ${p.brand ? `<div class="br">${esc(p.brand)}</div>` : ''}
      <div class="nm" data-open="${p.id}">${esc(p.name)}</div>
      <div class="pr"><b>${won(p.price)}</b>${stepHTML(p.id, qty)}</div>
    </div>
  </div>`;
}
function stepHTML(id, qty){
  return qty
    ? `<div class="step"><button data-dec="${id}">−</button><span>${qty}</span><button data-inc="${id}">+</button></div>`
    : `<button class="add" data-inc="${id}" aria-label="加入購物車">+</button>`;
}

// ---------- 搜尋比對 ----------
function matches(p, q){
  const hay = norm([p.name, p.nameKo, p.brand, p.keywords, p.desc, ...p.cats].join(' '));
  return q.split(/\s+/).map(norm).filter(Boolean).every(t => hay.includes(t));
}

// ---------- 主畫面 ----------
function render(){
  const main = $('#main');
  const list = S.products;
  if (S.q){
    const relCats = allCats().filter(c => norm(c).includes(norm(S.q)) || norm(S.q).includes(norm(c)));
    const res = list.filter(p => matches(p, S.q) || p.cats.some(c => relCats.includes(c)));
    main.innerHTML = `
      ${relCats.length ? `<div class="muted" style="margin-bottom:6px">相關分類</div><div class="related">${relCats.map(c => `<button class="chip ${S.settings.specialCategories.includes(c) ? 'sp' : ''}" data-goto="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : ''}
      <div class="muted" style="margin-bottom:10px">「${esc(S.q)}」找到 ${res.length} 項</div>
      ${res.length ? `<div class="grid">${res.map(cardHTML).join('')}</div>` : `<div class="empty">找不到相關商品，換個關鍵字試試</div>`}`;
    return;
  }
  if (S.cat !== '全部'){
    const res = list.filter(p => p.cats.includes(S.cat));
    main.innerHTML = `<div class="sec-h"><h2 class="${tagClass(S.cat) === 'tw' ? 'tw shine' : tagClass(S.cat) === 'hot' ? 'hot' : tagClass(S.cat) === 'champ' ? 'champ shine' : ''}">${esc(S.cat)}</h2><span class="muted">${res.length} 項</span></div>
      ${res.length ? `<div class="grid">${res.map(cardHTML).join('')}</div>` : `<div class="empty">這個分類還沒有商品</div>`}`;
    return;
  }
  let html = '';
  S.settings.specialCategories.forEach(c => {
    const res = list.filter(p => p.cats.includes(c));
    if (!res.length) return;
    html += `<div class="sec-h"><h2 class="${tagClass(c) === 'tw' ? 'tw shine' : tagClass(c) === 'hot' ? 'hot' : tagClass(c) === 'champ' ? 'champ shine' : ''}">${esc(c)}</h2><button data-goto="${esc(c)}">全部 ${res.length} ›</button></div>
             <div class="row">${res.map(cardHTML).join('')}</div>`;
  });
  html += `<div class="sec-h"><h2>所有商品</h2><span class="muted">${list.length} 項</span></div>
           ${list.length ? `<div class="grid">${list.map(cardHTML).join('')}</div>` : `<div class="empty">商品準備中</div>`}`;
  main.innerHTML = html;
}

document.body.addEventListener('click', e => {
  const t = e.target.closest('[data-inc],[data-dec],[data-open],[data-goto]');
  if (!t) return;
  if (t.dataset.inc) changeQty(t.dataset.inc, 1);
  else if (t.dataset.dec) changeQty(t.dataset.dec, -1);
  else if (t.dataset.open) openProduct(t.dataset.open);
  else if (t.dataset.goto){ S.cat = t.dataset.goto; S.q = ''; $('#q').value = ''; renderChips(); render(); window.scrollTo({top:0}); }
});

// ---------- 購物車 ----------
function changeQty(id, d){
  const q = Math.max(0, Math.min(99, (S.cart[id] || 0) + d));
  if (q) S.cart[id] = q; else delete S.cart[id];
  store.set('cb_cart', S.cart);
  $$(`.card[data-id="${id}"] .pr`).forEach(el => { el.innerHTML = `<b>${won(S.byId[id].price)}</b>${stepHTML(id, q)}`; });
  if (d > 0 && q === 1) toast('已加入購物車');
  renderCartBar();
  if (panelMode === 'cart') openCart();
  if (panelMode === 'product') openProduct(id);
}
function cartLines(){
  return Object.keys(S.cart).filter(id => S.byId[id]).map(id => ({ p:S.byId[id], qty:S.cart[id] }));
}
function cartSubtotal(){ return cartLines().reduce((a, l) => a + l.p.price * l.qty, 0); }
function renderCartBar(){
  const n = cartLines().reduce((a, l) => a + l.qty, 0);
  $('#cartCount').hidden = !n; $('#cartCount').textContent = n;
  $('#cartbar').classList.toggle('show', !!n && panelMode !== 'cart' && panelMode !== 'checkout');
  if (n){
    const t = totals(cartSubtotal(), S.settings, rate());
    $('#cbText').innerHTML = `${n} 件・商品總價 ${won(t.subtotal)}<b>預估花費 ${won(t.net)}</b>`;
  }
}
$('#btnCart').onclick = $('#cbGo').onclick = () => openCart();

function totalsHTML(sub){
  const s = S.settings, t = totals(sub, s, rate()), nb = nextBracket(sub, s);
  const pct = S.coupon ? Math.round(S.coupon.rate * 1000) / 10 : 0;
  return `<div class="tot">
    <div><span>商品總價</span><span class="won">${won(t.subtotal)}</span></div>
    ${S.coupon ? `<div class="g"><span>優惠碼 ${esc(S.coupon.code)}（${pct}%）</span><span class="won">−${won(t.discount)}</span></div>` : ''}
    <div class="g"><span>預估退稅</span><span class="won">−${won(t.refund)}</span></div>
    <div class="big"><span>預估實際花費</span><b class="won">${won(t.net)}</b></div>
  </div>
  ${nb ? `<div class="hint">再買 <b>${won(nb.need)}</b>，退稅可以提高到 <b>${won(nb.refund)}</b></div>` : ''}`;
}

// ---------- 底部面板 ----------
let panelMode = null;
function openPanel(mode, title, body, foot){
  panelMode = mode;
  $('#pTitle').textContent = title; $('#pBody').innerHTML = body; $('#pFoot').innerHTML = foot || '';
  $('#pFoot').style.display = foot ? '' : 'none';
  $('#ov').classList.add('open'); $('#panel').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderCartBar();
}
function closePanel(){
  panelMode = null;
  $('#ov').classList.remove('open'); $('#panel').classList.remove('open');
  document.body.style.overflow = '';
  renderCartBar();
}
$('#ov').onclick = $('#pClose').onclick = closePanel;

function openProduct(id){
  const p = S.byId[id]; if (!p) return;
  const keep = $('#pBody').scrollTop;
  openPanel('product', p.brand || '商品', `
    <div class="pdimg" style="${p.img ? `background-image:url('${esc(p.img)}')` : ''}"></div>
    <div style="font-size:19px;font-weight:900;line-height:1.35">${esc(p.name)}</div>
    ${p.nameKo ? `<div class="muted">${esc(p.nameKo)}</div>` : ''}
    <div style="font-size:22px;font-weight:900;color:var(--red);margin:8px 0">${won(p.price)}</div>
    <div class="related">${p.cats.map(c => `<button class="chip" data-goto="${esc(c)}" onclick="closePanel()">${esc(c)}</button>`).join('')}</div>
    ${p.desc ? `<div style="white-space:pre-wrap;color:var(--ink2);font-size:14px">${esc(p.desc)}</div>` : ''}`,
    `<div style="display:flex;gap:10px;align-items:center">
      <div style="flex:1">${S.cart[id] ? `<div class="step" style="width:120px;justify-content:space-between;height:44px"><button data-dec="${id}">−</button><span>${S.cart[id]}</span><button data-inc="${id}">+</button></div>` : ''}</div>
      ${S.cart[id] ? `<button class="btn" onclick="openCart()">前往購物車</button>` : `<button class="btn" data-inc="${id}">加入購物車</button>`}
    </div>`);
  $('#pBody').scrollTop = keep;
}

function openCart(){
  const lines = cartLines();
  if (!lines.length){
    openPanel('cart', '購物車', `<div class="empty">購物車是空的</div>`, `<button class="btn block" onclick="closePanel()">去逛逛</button>`);
    return;
  }
  const keep = $('#pBody').scrollTop;
  openPanel('cart', `購物車（${lines.length} 項）`,
    lines.map(({p, qty}) => `
      <div class="citem">
        <div class="ci" style="${p.img ? `background-image:url('${esc(p.img)}')` : ''}"></div>
        <div class="cn"><b>${esc(p.name)}</b><span>${won(p.price)} × ${qty} ＝ <b style="display:inline;color:var(--ink)">${won(p.price * qty)}</b></span></div>
        <div class="step"><button data-dec="${p.id}">−</button><span>${qty}</span><button data-inc="${p.id}">+</button></div>
      </div>`).join('') + totalsHTML(cartSubtotal()),
    `<button class="btn block" onclick="startCheckout()">產出訂購單</button>`);
  $('#pBody').scrollTop = keep;
}

// ---------- 會員 ----------
function renderMe(){ $('#meLabel').textContent = S.me ? '我的訂單' : '登入'; }
$('#btnMe').onclick = () => S.me ? openMyOrders() : openAuth();

let authMethod = 'LINE';
function openAuth(after, tab){
  tab = tab || 'login';
  const reg = tab === 'reg';
  openPanel('auth', '會員', `
    <div class="tabs2"><button data-t="login" class="${!reg ? 'on' : ''}">登入</button><button data-t="reg" class="${reg ? 'on' : ''}">註冊</button></div>
    ${after ? `<div class="hint" style="margin:0 0 14px">產出訂購單前請先登入，之後可以在「我的訂單」隨時查看</div>` : ''}
    <label class="field"><span id="aCidLbl">${authMethod} ID <b class="req">*</b></span><input id="aCid" autocomplete="username" autocapitalize="off" placeholder="${authMethod === 'LINE' ? 'LINE ID（沒有設定 ID 可填手機號碼）' : '你的微信號'}"></label>
    ${reg ? `<label class="field"><span>護照英文姓名 <b class="req">*</b></span><input id="aName" class="upper" autocomplete="name" autocapitalize="characters" placeholder="例：WANG XIAO MING"></label>` : ''}
    <label class="field"><span>密碼${reg ? '（至少 6 碼）' : ''} <b class="req">*</b></span><input id="aPw" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}"></label>
    <div id="aErr" style="color:var(--red);font-size:13px;min-height:20px"></div>`,
    `<button class="btn block" id="aGo">${reg ? '註冊並登入' : '登入'}</button>`);
  $$('.tabs2 button').forEach(b => b.onclick = () => openAuth(after, b.dataset.t));
  $$('[data-m]').forEach(b => b.onclick = () => {
    authMethod = b.dataset.m;
    $$('[data-m]').forEach(x => x.classList.toggle('on', x === b));
    $('#aCidLbl').innerHTML = `${authMethod} ID <b class="req">*</b>`;
    $('#aCid').placeholder = authMethod === 'LINE' ? 'LINE ID（沒有設定 ID 可填手機號碼）' : '你的微信號';
  });
  $('#aGo').onclick = async () => {
    const btn = $('#aGo'); btn.disabled = true; $('#aErr').textContent = '';
    try{
      const r = reg
        ? await api('api_register', authMethod, $('#aCid').value, $('#aName').value, $('#aPw').value)
        : await api('api_login', authMethod, $('#aCid').value, $('#aPw').value);
      S.token = r.token; S.me = { name:r.name, method:r.method, cid:r.cid }; S.orders = null;
      store.set('cb_token', r.token); renderMe();
      toast(`歡迎，${r.name}`);
      after ? after() : closePanel();
    }catch(e){ $('#aErr').textContent = e.message; btn.disabled = false; }
  };
}

function logout(){
  S.token = null; S.me = null; S.orders = null; store.del('cb_token'); renderMe(); closePanel(); toast('已登出');
}

// ---------- 結帳 ----------
let pickSel = null;
const seoulToday = () => { try{ return new Date().toLocaleDateString('en-CA', { timeZone:'Asia/Seoul' }); }catch(e){ return new Date().toISOString().slice(0, 10); } };
const NAME_RE = /^[A-Z][A-Z ,.'\-]{1,59}$/;
const cleanName = v => String(v || '').trim().replace(/\s+/g, ' ').toUpperCase();

function couponHTML(){
  return S.coupon
    ? `<div class="cpn-ok"><span>✓ 已套用 ${esc(S.coupon.code)}（折 ${Math.round(S.coupon.rate * 1000) / 10}%）</span><button class="btn ghost sm" id="cpDel">移除</button></div>`
    : `<div class="cpn"><input id="cpIn" placeholder="有優惠碼請輸入" autocapitalize="characters" autocomplete="off"><button class="btn ghost" id="cpGo">套用</button></div>
       <div id="cpErr" style="color:var(--red);font-size:13px;margin-top:4px"></div>`;
}
function bindCoupon(){
  const refresh = () => { $('#cpBox').innerHTML = couponHTML(); $('#ckTot').innerHTML = totalsHTML(cartSubtotal()); bindCoupon(); renderCartBar(); };
  if ($('#cpDel')) $('#cpDel').onclick = () => { S.coupon = null; store.del('cb_coupon'); store.set('cb_cp_off', true); refresh(); };
  if ($('#cpGo')){
    const go = async () => {
      const code = $('#cpIn').value.trim(); if (!code) return;
      $('#cpGo').disabled = true; $('#cpErr').textContent = '';
      try{ S.coupon = await api('api_checkCoupon', code); store.set('cb_coupon', S.coupon); store.del('cb_cp_off'); toast('優惠碼已套用'); refresh(); }
      catch(e){ $('#cpErr').textContent = e.message; $('#cpGo').disabled = false; }
    };
    $('#cpGo').onclick = go;
    $('#cpIn').onkeydown = e => { if (e.key === 'Enter') go(); };
  }
}

let ckMethod = 'LINE';
function startCheckout(){
  if (!S.me) return openAuth(startCheckout);
  const s = S.settings;
  ckMethod = 'LINE';
  openPanel('checkout', '產出訂購單', `
    <div class="field"><span>取貨地點 <b class="req">*</b></span></div>
    <div class="picks">${s.pickups.map(p => `<button class="pickopt ${pickSel === p.name ? 'on' : ''}" data-pick="${esc(p.name)}"><b>${esc(p.name)}</b><small>${esc(p.addr || '韓國藥局現場取貨結帳')}</small></button>`).join('')}</div>
    <label class="field"><span>預計取貨日（韓國時間）<b class="req">*</b></span><input id="cDate" type="date" min="${seoulToday()}"></label>
    <label class="field"><span>護照英文姓名 <b class="req">*</b>（取貨時核對護照）</span><input id="cName" class="upper" value="${esc(S.me.name)}" autocapitalize="characters" placeholder="例：WANG XIAO MING"></label>
    <label class="field"><span id="cCidLbl">${ckMethod} ID <b class="req">*</b></span><input id="cCid" value="${esc(S.me.cid || '')}" autocapitalize="off" placeholder="${ckMethod === 'LINE' ? 'LINE ID（沒有設定 ID 可填手機號碼）' : '微信號'}"></label>
    <div class="field"><span>優惠碼</span><div id="cpBox">${couponHTML()}</div></div>
    <label class="field"><span>備註（選填）</span><textarea id="cNote" maxlength="300" placeholder="例：預計下午 3 點到"></textarea></label>
    <div id="ckTot">${totalsHTML(cartSubtotal())}</div>`,
    `<button class="btn block" id="cGo">確認送出訂購單</button>`);
  $$('[data-pick]').forEach(b => b.onclick = () => { pickSel = b.dataset.pick; $$('[data-pick]').forEach(x => x.classList.toggle('on', x === b)); });
  $$('[data-cm]').forEach(b => b.onclick = () => {
    ckMethod = b.dataset.cm;
    $$('[data-cm]').forEach(x => x.classList.toggle('on', x === b));
    $('#cCidLbl').innerHTML = `${ckMethod} ID <b class="req">*</b>`;
    $('#cCid').placeholder = ckMethod === 'LINE' ? 'LINE ID（沒有設定 ID 可填手機號碼）' : '微信號';
  });
  bindCoupon();
  $('#cGo').onclick = submitOrder;
}

async function submitOrder(){
  const name = cleanName($('#cName').value), date = $('#cDate').value;
  if (!pickSel) return toast('請選擇取貨地點');
  if (!date) return toast('請選擇預計取貨日');
  if (date < seoulToday()) return toast('預計取貨日不能早於今天');
  if (!NAME_RE.test(name)) return toast('請輸入護照上的英文姓名（例：WANG XIAO MING）');
  const cid = $('#cCid').value.trim();
  if (cid.length < 2) return toast(`請輸入 ${ckMethod} ID`);
  if ($('#cpIn') && $('#cpIn').value.trim()) return toast('優惠碼請先按「套用」，或清空再送出');
  const btn = $('#cGo'); btn.disabled = true; btn.textContent = '送出中…';
  try{
    const o = await api('api_placeOrder', S.token, {
      items: cartLines().map(l => ({ id:l.p.id, qty:l.qty })),
      pickup: pickSel, date, name, method: ckMethod, cid, note: $('#cNote').value,
      coupon: S.coupon ? S.coupon.code : ''
    });
    S.cart = {}; store.set('cb_cart', S.cart); S.orders = null;
    $$('.card').forEach(el => { const id = el.dataset.id; $('.pr', el).innerHTML = `<b>${won(S.byId[id].price)}</b>${stepHTML(id, 0)}`; });
    renderCartBar();
    showOrder(o, true);
  }catch(e){
    if (e.message === 'LOGIN'){ S.me = null; S.token = null; store.del('cb_token'); renderMe(); return openAuth(startCheckout); }
    if (/優惠碼/.test(e.message)){ S.coupon = null; store.del('cb_coupon'); if ($('#cpBox')){ $('#cpBox').innerHTML = couponHTML(); $('#ckTot').innerHTML = totalsHTML(cartSubtotal()); bindCoupon(); } }
    toast(e.message); btn.disabled = false; btn.textContent = '確認送出訂購單';
  }
}

// ---------- 訂購單 ----------
function showOrder(o, fresh){
  openPanel('order', fresh ? '訂購單已送出 ✓' : '訂購單', `
    ${fresh ? `<div class="hint" style="margin:0 0 14px;background:#e2f4ea;color:var(--green)">熊貓藥局已收到你的訂購單，會幫你留貨。可以在「我的訂單」隨時查看。</div>` : ''}
    <div class="hint" id="saveHint" style="margin:0 0 12px;text-align:center">📌 <b>長按下方訂購單圖片</b> → 選「儲存圖片」或「加入照片」即可保存</div>
    <div class="sheetwrap"><div class="scaler">${orderSheetHTML(o, S.settings, 'customer')}</div></div>
    <img id="sheetImg" alt="訂購單 ${o.no}" style="display:none;width:100%;border-radius:8px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.12);-webkit-touch-callout:default;user-select:auto">`);
  fitSheet();
  const no = o.no;
  sheetCanvas(o, S.settings, 'customer').then(c => {
    const img = $('#sheetImg'); if (!img || S.sheetNo !== no) return;
    img.src = c.toDataURL('image/png'); img.style.display = 'block';
    const w = $('.sheetwrap'); if (w) w.style.display = 'none';
  }).catch(() => { const h = $('#saveHint'); if (h) h.innerHTML = '📌 請<b>截圖</b>保存這張訂購單'; });
  S.sheetNo = no;
}
function fitSheet(){
  const w = $('.sheetwrap'); if (!w) return;
  const sc = $('.scaler', w), k = w.clientWidth / 760;
  sc.style.transform = `scale(${k})`; w.style.height = sc.firstElementChild.offsetHeight * k + 'px';
}
window.addEventListener('resize', fitSheet);

async function openMyOrders(){
  openPanel('orders', '我的訂單', `<div class="spin"></div>`,
    `<div style="display:flex;justify-content:space-between;align-items:center"><span class="muted">${esc(S.me.name)}・${esc(S.me.method)} ${esc(S.me.cid)}</span><button class="btn ghost sm" onclick="logout()">登出</button></div>`);
  try{
    if (!S.orders) S.orders = await api('api_myOrders', S.token);
    if (panelMode !== 'orders') return;
    $('#pBody').innerHTML = S.orders.length ? `<div class="olist">${S.orders.map((o, i) => `
      <button class="oitem" data-oi="${i}">
        <div class="t"><span>${esc(o.no)}</span><span class="st ${esc(o.status)}">${esc(o.status)}</span></div>
        <div class="muted">${esc(o.created)}・${esc(o.pickup)}取貨${o.date ? '・' + esc(o.date) : ''}</div>
        <div style="margin-top:4px">${o.items.length} 項商品・<b class="won">${won(o.subtotal)}</b></div>
      </button>`).join('')}</div>` : `<div class="empty">還沒有訂單</div>`;
    $$('[data-oi]').forEach(b => b.onclick = () => showOrder(S.orders[b.dataset.oi]));
  }catch(e){
    if (e.message === 'LOGIN'){ logout(); return openAuth(); }
    $('#pBody').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}
</script>
</body>
</html>
